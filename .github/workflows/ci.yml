name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: xcodebuild -version

      - name: Lint
        run: swift format lint --strict --recursive Sources Tests Package.swift

      - name: Build and test on iOS Simulator
        run: |
          DEVICE=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name | test("^iPhone"))] | first | .name')
          echo "Using simulator: ${DEVICE}"
          xcodebuild test \
            -scheme Permissionary \
            -destination "platform=iOS Simulator,name=${DEVICE}"
