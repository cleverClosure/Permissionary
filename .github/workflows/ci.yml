name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: xcodebuild -version

      - name: Lint
        run: swift format lint --strict --recursive Sources Tests Examples Package.swift

      - name: Select simulator
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name | test("^iPhone"))] | first | .udid')
          xcrun simctl list devices available | grep "${UDID}"
          echo "SIMULATOR_UDID=${UDID}" >> "$GITHUB_ENV"

      - name: Build and test on iOS Simulator
        run: |
          xcodebuild test \
            -scheme Permissionary \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}"

      - name: Build demo app
        run: |
          xcodebuild build \
            -project Examples/PermissionaryDemo/PermissionaryDemo.xcodeproj \
            -scheme PermissionaryDemo \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build documentation
        run: |
          xcodebuild docbuild \
            -scheme Permissionary \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            OTHER_DOCC_FLAGS=--warnings-as-errors
